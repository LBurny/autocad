[project]
name = "acadmcp"
version = "0.1.0"
description = "AutoCAD-MCP: an MCP server that lets AI clients drive AutoCAD to draw 2D architectural floor plans, through live COM automation or headless DXF generation."
readme = "README.md"
license = { text = "MIT" }
keywords = ["autocad", "cad", "mcp", "model-context-protocol", "floor-plan", "architecture"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.12.2",
    "ezdxf>=1.1",
    "pillow>=10",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]

[project.scripts]
acadmcp = "acadmcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acadmcp"]
